# Runs on the public hub only (copied by scripts/stage-public-hub.sh).
# Do not place this under the private repo's .github/workflows/.
name: Close incoming pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Thanks for the PR.',
              '',
              'This repository is a **docs and issues hub** — component source is not stored here, and we do not merge pull requests (the next docs sync would overwrite them).',
              '',
              '- Bugs / features: https://github.com/Base-ui-ng/base-ui/issues/new/choose',
              '- Questions: https://github.com/Base-ui-ng/base-ui/discussions',
              '- Install: `npx base-ui-cli add button` from https://base-ui.net',
              '',
              'See CONTRIBUTING.md.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });
